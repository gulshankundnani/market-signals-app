<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Signals</title>
<meta name="description" content="Buy, hold and sell signals for Indian and US stocks, with news, buying pressure, risk and IPO checks.">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<header class="top">
  <div class="brand"><img src="icon.svg" alt="" width="28" height="28"><h1>Stock Signals</h1></div>
  <div class="status">
    <span id="updated" role="status">Loading data...</span>
    <button id="refresh" class="iconbtn" type="button" aria-label="Refresh data" title="Refresh data">&#8635;</button>
    <button id="notify" class="chip" type="button" aria-pressed="false">Alerts off</button>
  </div>
</header>
<nav class="tabs" aria-label="Sections">
  <button type="button" data-tab="signals" aria-current="page">Signals</button>
  <button type="button" data-tab="suggest">Suggestions</button>
  <button type="button" data-tab="ipo">IPOs</button>
  <button type="button" data-tab="market">Market</button>
</nav>
<div id="banner" class="banner" role="alert" hidden></div>
<main id="view" tabindex="-1"></main>
<dialog id="detail" aria-label="Stock details"></dialog>
<div id="toasts" aria-live="polite"></div>
<footer>
  Signals come from fixed technical and news rules on delayed free data. They are not investment advice and can be wrong.
  Past results do not guarantee future results. Never invest money you cannot afford to lose.
</footer>
<script src="ipo.js"></script>
<script src="app.js"></script>
</body>
</html>
